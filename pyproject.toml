[project]
name = "les1mple"
version = "0.1.0"
description = "LeS1mple: A Hierarchical JEPA World Model for Long-Horizon Multi-Agent Dynamics in Counter-Strike"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "torchvision",
    "pandas",
    "pyarrow",
    "opencv-python-headless",
    "imageio",
]

[project.optional-dependencies]
train = [
    "stable-worldmodel[train]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
